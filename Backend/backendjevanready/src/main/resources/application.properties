spring.application.name=backendjevanready

# Use fallbacks so it works locally and on Render
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jevanready_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:SYSTEM3024}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8080}

# Serve uploaded files statically
file.upload-dir=uploads/

# Multipart Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB